# 内容分离的唯一部署入口。
#
# 触发来源：
#   1. 内容仓库 Mizuki-Content 推送后发送 repository_dispatch(content-updated)
#   2. 本仓库 master 推送（代码更新）
#   3. 手动触发
#
# 为什么用 self-hosted：腾讯云对异常来源 IP 的 SSH 登录有拦截，
# GitHub 托管 Runner（美国 IP）推不到这台服务器，因此构建与部署都在服务器本机完成。
#
# 为什么不在这里再改 ENABLE_CONTENT_SYNC：
# 构建前的 prebuild 钩子会跑 scripts/sync-content.js，它负责把 content/ 下的内容
# 软链接进 src/content/posts、src/content/spec、src/data、public/images。
# 一旦把它覆盖成 false，sync 会直接退出，构建就会拿旧快照当成"成功"——
# 这正是之前线上内容不更新的根因，不要再犯。
name: Build and Deploy

on:
  repository_dispatch:
    types: [content-updated]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 构建与部署不能并发：多个 job 同时写 /home/ubuntu/blog-dist 会互相覆盖
concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 45

    env:
      # 相对 runner workspace 根目录，与 checkout 的 path 保持一致
      CONTENT_DIR: ./content

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Seed content workspace from local clone
        # 这台服务器到 GitHub 的带宽很窄：从零浅克隆内容仓库要 15 分钟以上，
        # 会把整个 job 的超时预算吃光（实测 23 分钟后被取消）。
        # 服务器上已有一份常驻克隆，先复制过来，后面 actions/checkout 就只需取增量。
        run: |
          set -e
          seed=/home/ubuntu/Mizuki/content
          if [ -d "$seed/.git" ]; then
            rm -rf content
            cp -a "$seed" content
            echo "已从本地克隆预置 content（$(git -C content log --oneline -1)）"
          else
            echo "本地克隆不存在，跳过预置（将由 actions/checkout 完整克隆，会比较慢）"
          fi

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: lickoc/Mizuki-Content
          path: content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          # 不参与 clean：content/ 不在主仓库索引里，
          # 且上一轮的软链接目标需要保留给 sync 复用
          clean: false
          # 只取目标提交，配合上面的预置克隆把传输量压到最小
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync content
        # 显式跑一次，让"内容没同步上"在构建日志里立刻可见
        run: pnpm run sync-content

      - name: Verify content source
        run: |
          set -e
          for d in src/content/posts src/content/spec src/data public/images; do
            if [ ! -e "$d" ]; then
              echo "::error::内容未同步到 $d，构建会使用旧快照或直接失败"
              exit 1
            fi
          done
          echo "内容源可读："
          ls -1 src/content/posts/ | head -20
          echo "内容仓库版本：$(git -C content log --oneline -1)"

      - name: Build site
        run: pnpm run build

      - name: Deploy to nginx
        # Runner 就在服务器上，直接本地替换即可，
        # 不走 SCP，既不需要 SSH 私钥也没有来源 IP 被拦截的问题。
        run: |
          set -e
          rm -rf /home/ubuntu/blog-dist
          cp -r dist /home/ubuntu/blog-dist
          echo "deployed $(du -sh /home/ubuntu/blog-dist | cut -f1)"

      - name: Reload nginx
        run: |
          set -e
          sudo nginx -t
          sudo systemctl reload nginx
          echo "nginx reloaded"

      - name: Verify deployed output
        run: |
          set -e
          test -f /home/ubuntu/blog-dist/index.html || {
            echo "::error::部署目录缺少 index.html"
            exit 1
          }
          echo "已发布文章："
          ls -1 /home/ubuntu/blog-dist/posts/ 2>/dev/null || echo "(无 posts 目录)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build and Deploy"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 内容版本 | \`$(git -C content log --oneline -1 2>/dev/null || echo n/a)\` |"
            echo "| 部署大小 | \`$(du -sh /home/ubuntu/blog-dist 2>/dev/null | cut -f1 || echo n/a)\` |"
          } >> $GITHUB_STEP_SUMMARY
